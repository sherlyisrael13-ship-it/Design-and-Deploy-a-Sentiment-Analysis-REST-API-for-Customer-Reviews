<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U3-P01 :: Cloud AI Sentiment (Dark UI)</title>
    <style>
        body {
            background: #1e2733;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dark-card-window {
            width: 100%;
            max-width: 450px;
            background-color: #2b3952;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.5), 
                0 0 15px rgba(30, 136, 229, 0.4) inset; 
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #42a5f5; 
            font-size: 1.8em;
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(66, 165, 245, 0.8);
        }

        .subtitle {
            color: #b0bec5;
            font-size: 0.9em;
            margin-bottom: 25px;
            font-weight: 300;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            background-color: #1e2733; 
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 25px;
            border: 1px solid #455a64;
            border-radius: 10px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s;
        }
        textarea::placeholder {
            color: #78909c;
        }
        textarea:focus {
            outline: none;
            border-color: #42a5f5;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 8px rgba(66, 165, 245, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(145deg, #1e88e5, #1565c0); 
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.6);
            transition: all 0.2s;
        }

        button:hover {
            background: linear-gradient(145deg, #1565c0, #1e88e5);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.8);
        }
        button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(30, 136, 229, 0.4);
        }
        
        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #1e2733;
            border: 1px solid #455a64;
            border-radius: 10px;
            display: none;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.7);
        }

        #results h3 {
            margin-top: 0;
            color: #42a5f5;
            font-size: 1.1em;
            border-bottom: 1px solid #455a64;
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #results pre {
            background-color: #1e2733;
            padding: 0;
            border-radius: 0;
            overflow-x: auto;
            color: #aed581; 
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .loading {
            font-style: italic;
            color: #ffb74d; 
            font-weight: normal;
        }

        .sentiment-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px; 
            font-weight: 600;
            font-size: 0.85em;
            color: #1e2733;
            background-color: #ffb74d;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
            margin-left: 10px;
        }
        .positive { background-color: #66bb6a; color: #1e2733; } 
        .negative { background-color: #e57373; color: white; } 
        .neutral { background-color: #ffb74d; color: #1e2733; } 
        
        .metadata-label {
            color: #4fc3f7; 
        }
    </style>
</head>
<body>

    <div class="dark-card-window">
        <h1>Cloud AI Sentiment</h1>
        <p class="subtitle">A real-time REST API demonstration deployed on Google Cloud Run.</p>

        <textarea id="reviewInput" placeholder="Enter your text here... e.g., 'The service was unreliable and the support was slow, but the price was low.'"></textarea>

        <button id="analyzeButton">Analyze Sentiment</button>

        <div id="results">
            <h3 id="resultsHeader">Terminal Output:</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        document.getElementById("analyzeButton").addEventListener("click", analyzeSentiment);

        async function analyzeSentiment() {
            const reviewText = document.getElementById("reviewInput").value;
            const resultsDiv = document.getElementById("results");
            const resultContent = document.getElementById("resultContent");
            const resultsHeader = document.getElementById("resultsHeader");

            const apiUrl = "https://sentiment-api-u3p01-250971162119.us-central1.run.app/predict";

            if (!reviewText.trim()) {
                alert("Please enter some text to analyze.");
                return;
            }

            resultsDiv.style.display = "block";
            resultsHeader.innerHTML = `Analysis Result: <span class="loading">[CONNECTING...]</span>`;
            resultContent.innerHTML = '';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        review_text: reviewText
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();

                const sentiment = data.sentiment.toLowerCase();
                let sentimentClass = 'neutral';
                
                if (sentiment === 'positive') {
                    sentimentClass = 'positive';
                } else if (sentiment === 'negative') {
                    sentimentClass = 'negative';
                }

                const formattedJson = JSON.stringify(data, null, 2)
                    .replace(/"([^"]+)":/g, '<span class="metadata-label">$1</span>:') 
                    .replace(/null/g, 'NULL')
                    .replace(/"/g, ''); 

                resultsHeader.innerHTML = `
                    Analysis Result:
                    <span class="sentiment-badge ${sentimentClass}">STATUS: ${data.sentiment.toUpperCase()}</span>
                `;

                resultContent.innerHTML = `
                    <p style="text-align: left; margin: 5px 0 0 0; color: #42a5f5; font-weight: bold; font-size: 0.9em;">
                        > API RESPONSE RECEIVED
                    </p>
                    <pre>${formattedJson}</pre>
                `;

            } catch (error) {
                resultsHeader.innerHTML = 'Terminal Output:';
                resultContent.innerHTML = `<p style="color: #e57373; text-align: left; font-weight: bold;">[ERROR] Could not reach live API. ${error.message}.</p>`;
            }
        }
    </script>
</body>
</html>
